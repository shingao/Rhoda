name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# A tag v* also drafts the GitHub release (last step).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, tokens, contrast, unit tests
        run: npm run check

      # Chromium, like WebView2: rhythm and page backgrounds at 100-175 %
      # Windows scaling, then the accessibility audit (axe, keyboard, reduced
      # motion, high contrast).
      - name: Rhythm and display scaling, accessibility
        run: |
          npx playwright install chromium
          npm run test:rhythm
          npm run test:a11y

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The real OCR tests run in their own step, at the end.
      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test -- --skip ocr::windows
          cargo test scan_reads_2000_notes -- --nocapture

      # The same app numbered 0.9.0, kept aside for the upgrade test.
      - name: Build a 0.9.0 installer (upgrade test)
        shell: pwsh
        run: |
          '{"version":"0.9.0"}' | Set-Content "$env:RUNNER_TEMP/version-0.9.0.json"
          npx tauri build --config "$env:RUNNER_TEMP/version-0.9.0.json"
          Move-Item src-tauri/target/release/bundle/nsis/*_0.9.0_*-setup.exe "$env:RUNNER_TEMP/"

      # Per-user NSIS installer in French, WebView2 bootstrapper inside.
      - name: Build the installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bullshit-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # The real PDF export: the release build prints an export page (3 A4 pages, lined
      # paper, fonts inside) from its hidden window with WebView2's PrintToPdf, then quits.
      - name: PDF export through WebView2 (must write a real PDF)
        shell: bash
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/export-smoke.pdf"
          # Windows paths for the app; MSYS must not rewrite this variable.
          export MSYS2_ENV_CONV_EXCL=URSA_PDF_SMOKE
          export URSA_PDF_SMOKE="$(cygpath -w "$PWD/src-tauri/tests/fixtures/export-page.html")|$(cygpath -w "$out")"
          timeout 180 src-tauri/target/release/bullshit.exe || { cat "${out%.pdf}.error.txt" 2>/dev/null; echo "::error::the app could not print the PDF"; exit 1; }
          test -s "$out" || { echo "::error::no PDF written"; exit 1; }
          head -c 5 "$out" | grep -q "%PDF-" || { echo "::error::not a PDF"; exit 1; }
          pages=$(grep -a -o "/Count [0-9]*" "$out" | sort -t' ' -k2 -n | tail -1 | cut -d' ' -f2)
          fonts=$(grep -a -o "/FontFile2" "$out" | wc -l)
          echo "PDF: $(stat -c %s "$out") bytes, $pages pages, $fonts embedded fonts"
          [ "${pages:-0}" -ge 2 ] || { echo "::error::expected several A4 pages, got $pages"; exit 1; }
          [ "$fonts" -ge 1 ] || { echo "::error::fonts not embedded"; exit 1; }

      # Silent install, shortcuts, launch (the window opens), migration of Documents\Ursa,
      # single instance, silent uninstall with the notes untouched; then 0.9.0 → 1.0.0
      # over it with settings and notes kept. See the script for every check.
      - name: Installer, uninstaller and upgrade
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/*_${version}_*-setup.exe"
          $old = Get-Item "$env:RUNNER_TEMP/*_0.9.0_*-setup.exe"
          ./scripts/ci/installer-test.ps1 -Version $version -Setup $setup.FullName -OldSetup $old.FullName

      # Pictures of the real installer and uninstaller pages (docs/captures/phase-10d).
      - name: Installer captures
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/*_${version}_*-setup.exe"
          ./scripts/ci/installer-shots.ps1 -Setup $setup.FullName -Out "$env:RUNNER_TEMP/installer-captures"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: installer-captures
          path: ${{ runner.temp }}/installer-captures/*.png

      # Last, so that its output (installed languages, text and boxes read) ends the log.
      # The step fails unless exactly these real OCR tests ran and passed: no engine,
      # no English recognizer, a word not read, or a test skipped or filtered out
      # turns the run red.
      - name: Windows OCR on real pictures (must run and pass)
        working-directory: src-tauri
        shell: bash
        run: |
          tests="reads_known_text_with_windows_ocr reads_a_tilted_photo_saved_sideways reads_a_picture_wider_than_the_engine_limit"
          cargo test --lib ocr::windows -- --list | tee ocr-tests.list
          for test in $tests; do
            grep -qx "ocr::windows::tests::$test: test" ocr-tests.list || { echo "::error::real OCR test $test is missing"; exit 1; }
          done
          cargo test --lib ocr::windows -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee ocr-tests.log
          grep -q "^test result: ok\. 3 passed; 0 failed; 0 ignored" ocr-tests.log || { echo "::error::the 3 real OCR tests did not all run and pass"; exit 1; }

      # Tag v*: a draft release with the installer and the notes of that version
      # in CHANGELOG.md. Published by hand.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $notes = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          if (-not $notes) { throw "no CHANGELOG.md section for $version" }
          Set-Content "$env:RUNNER_TEMP/release-notes.md" $notes -Encoding utf8NoBOM
          "version=$version" >> $env:GITHUB_OUTPUT
        id: notes

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          name: Bullshit ${{ steps.notes.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: src-tauri/target/release/bundle/nsis/*_${{ steps.notes.outputs.version }}_*-setup.exe
          fail_on_unmatched_files: true
